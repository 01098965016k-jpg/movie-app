<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP免费追剧神器 - 手机智能转换版</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 680px;
            padding: 25px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        h2 { text-align: center; margin-bottom: 20px; color: #333; font-size: 20px; }
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-group input {
            flex: 1;
            padding: 12px;
            font-size: 14px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
        }
        .btn {
            padding: 12px 14px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-clear { background-color: #909399; color: white; }
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .btn-platform { background-color: #409eff; color: white; font-size: 14px; }
        .line-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            align-items: center;
        }
        .line-group label { font-size: 13px; color: #606266; white-space: nowrap; }
        .line-group select {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            background: #fff;
            outline: none;
        }
        .btn-play {
            width: 100%;
            background-color: #67c23a;
            color: white;
            font-weight: bold;
            font-size: 16px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .reminder {
            margin-top: 15px;
            text-align: center;
            color: #909399;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>VIP免费追剧神器</h2>
    
    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="直接粘贴手机端分享链接">
        <button class="btn btn-clear" onclick="empty()">清空</button>
    </div>

    <div class="btn-grid">
        <button class="btn btn-platform" onclick="openIqy()">爱奇艺</button>
        <button class="btn btn-platform" onclick="openTx()">腾讯视频</button>
        <button class="btn btn-platform" onclick="openYq()">优酷视频</button>
        <button class="btn btn-platform" onclick="openMg()">芒果 TV</button>
    </div>

    <div class="line-group">
        <label>纯净线路：</label>
        <select id="apiSelect">
            <option value="https://jx.jsonplayer.com/player/?url=">线路 1 (芒果/腾讯专线)</option>
            <option value="https://jx.playerjy.com/?url=">线路 2 (无弹窗专线)</option>
            <option value="https://jx.quankan.app/jiexi/?url=">线路 3 (全看超清)</option>
            <option value="https://okjx.cc/?url=">线路 4 (OK 备用)</option>
        </select>
    </div>

    <button class="btn-play" onclick="playVideo()">▶ 立即播放 VIP 视频</button>

    <div class="reminder">
        ✨ 已内置<b>手机路径深度转换</b>逻辑，自动修正腾讯及芒果移动端网址。
    </div>
</div>

<script>
    function empty() { document.getElementById('videoUrl').value = ''; }
    function openIqy() { window.open('https://www.iqiyi.com', '_blank'); }
    function openTx() { window.open('https://v.qq.com', '_blank'); }
    function openYq() { window.open('https://www.youku.com/', '_blank'); }
    function openMg() { window.open('https://www.mgtv.com/', '_blank'); }

    function convertMobileUrl(raw) {
        var urlMatch = raw.match(/https?:\/\/[^\s"'<>]+/);
        if (!urlMatch) return null;
        var url = urlMatch[0];

        // 1. 深度修正腾讯移动端 URL
        if (url.indexOf('v.qq.com') !== -1) {
            var vidMatch = url.match(/vid=([a-zA-L0-9]+)/);
            var cidMatch = url.match(/cid=([a-zA-L0-9]+)/);
            if (vidMatch && cidMatch) {
                return 'https://v.qq.com/x/cover/' + cidMatch[1] + '/' + vidMatch[1] + '.html';
            } else if (vidMatch) {
                return 'https://v.qq.com/x/page/' + vidMatch[1] + '.html';
            }
        }

        // 2. 深度修正芒果移动端 URL
        if (url.indexOf('mgtv.com') !== -1) {
            url = url.split('?')[0].replace('//m.mgtv.com', '//www.mgtv.com');
            return url;
        }

        // 3. 修正优酷移动端
        if (url.indexOf('youku.com') !== -1) {
            url = url.split('?')[0].replace('//m.youku.com', '//v.youku.com');
            return url;
        }

        // 4. 修正爱奇艺移动端
        if (url.indexOf('iqiyi.com') !== -1) {
            url = url.split('?')[0].replace('//m.iqiyi.com', '//www.iqiyi.com');
            return url;
        }

        return url.split('?')[0];
    }

    function playVideo() {
        var rawInput = document.getElementById('videoUrl').value.trim();
        if (!rawInput) {
            alert('请先粘贴视频网址！');
            return;
        }

        var finalUrl = convertMobileUrl(rawInput);
        if (!finalUrl) {
            alert('未识别到有效网址，请重新复制粘贴！');
            return;
        }

        var api = document.getElementById('apiSelect').value;
        window.open(api + encodeURIComponent(finalUrl), '_blank');
    }
</script>

</body>
</html>

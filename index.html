<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP追剧神器 - 尊享超清蓝光版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fafbfc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #1a1a1a;
            font-weight: 700;
        }
        .input-wrapper {
            margin-bottom: 20px;
            position: relative;
        }
        .input-wrapper input {
            width: 100%;
            padding: 16px 20px;
            font-size: 16px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
            -webkit-appearance: none;
        }
        .input-wrapper input:focus {
            border-color: #409eff;
            box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.1);
        }
        .btn-play {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            background-color: #67c23a;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
            -webkit-appearance: none;
        }
        .btn-play:active {
            background-color: #5daf34;
            transform: scale(0.98);
        }
        .platform-tips {
            margin-top: 10px;
            font-size: 13px;
            color: #606266;
            line-height: 1.6;
        }
        .platform-tips b {
            color: #409eff;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>VIP 超清/蓝光追剧</h2>
    
    <div class="input-wrapper">
        <input type="text" id="videoUrl" placeholder="粘贴视频网址 (尊享超清蓝光资源)">
    </div>

    <button class="btn-play" onclick="playVideo()">▶ 立即免费播放 (超清)</button>

    <div class="platform-tips">
        💡 <b>尊享追剧小贴士：</b><br>
        1. 粘贴链接后，点击按钮跳转至 <b>超清/蓝光专用线路</b>。<br>
        2. 默认输出最高清晰度（视资源而定），专享视听盛宴。<br>
        3. 如遇卡顿，建议检查网络环境。
    </div>
</div>

<script>
    function playVideo() {
        var videoInput = document.getElementById('videoUrl').value.trim();
        if (!videoInput) {
            alert('请先粘贴视频网址！');
            return;
        }
        
        // 更换为更稳定的 OK 解析接口，该接口通常默认提供最高清晰度资源
        var specializedApi = 'https://okjx.cc/?url=';
        var parseUrl = specializedApi + encodeURIComponent(videoInput);
        
        // 跳转到新页面播放，确保 mobile Safari 的播放稳定性
        window.open(parseUrl, '_blank');
    }
</script>

</body>
</html>

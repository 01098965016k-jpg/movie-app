<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP免费追剧神器 - 超清尊享版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 680px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .input-group input {
            flex: 1;
            padding: 12px 14px;
            font-size: 15px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #409eff;
        }
        .btn {
            padding: 12px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear {
            background-color: #909399;
            color: white;
        }
        .btn-clear:hover { background-color: #73767a; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-platform {
            background-color: #409eff;
            color: white;
            font-size: 15px;
        }
        .btn-platform:hover { background-color: #66b1ff; }

        .btn-play {
            background-color: #67c23a;
            color: white;
            font-weight: bold;
            font-size: 16px;
            grid-column: span 2;
            padding: 14px;
        }
        .btn-play:hover { background-color: #85ce61; }

        .reminder {
            margin-top: 20px;
            text-align: center;
            color: #909399;
            font-size: 13px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>VIP免费追剧神器</h2>
    
    <!-- 输入框与清空按钮 -->
    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="粘贴App分享链接或视频网址: ">
        <button class="btn btn-clear" onclick="empty()">清空</button>
    </div>

    <!-- 平台快捷按钮与播放按钮 -->
    <div class="btn-grid">
        <button class="btn btn-platform" onclick="openIqy()">爱奇艺</button>
        <button class="btn btn-platform" onclick="openTx()">腾讯视频</button>
        <button class="btn btn-platform" onclick="openYq()">优酷视频</button>
        <button class="btn btn-platform" onclick="openMg()">芒果 TV</button>
        <button class="btn btn-play" onclick="playVideo()">▶ 立即播放 VIP 视频 (超清)</button>
    </div>

    <div class="reminder">
        ✨ 已经开启<b>手机端智能防错过滤</b>，可直接粘贴 App 分享的全套文本。
    </div>
</div>

<script>
    function empty() {
        document.getElementById('videoUrl').value = '';
    }

    function openIqy() { window.open('https://www.iqiyi.com', '_blank'); }
    function openTx() { window.open('https://v.qq.com', '_blank'); }
    function openYq() { window.open('https://www.youku.com/', '_blank'); }
    function openMg() { window.open('https://www.mgtv.com/', '_blank'); }

    function playVideo() {
        var rawInput = document.getElementById('videoUrl').value.trim();
        if (!rawInput) {
            alert('请先粘贴视频网址！');
            return;
        }

        // 1. 自动过滤掉 App 复制文本中的中文和杂质，只提取标准网址
        var urlMatch = rawInput.match(/https?:\/\/[^\s]+/);
        if (!urlMatch) {
            alert('未识别到有效网址，请重新复制粘贴！');
            return;
        }
        var cleanUrl = urlMatch[0];

        // 2. 自动将移动端 m. 网址替换为电脑端标准网址，防止接口报错
        cleanUrl = cleanUrl.replace('//m.youku.com', '//v.youku.com')
                           .replace('//m.iqiyi.com', '//www.iqiyi.com')
                           .replace('//m.mgtv.com', '//www.mgtv.com')
                           .replace('//m.v.qq.com', '//v.qq.com');
        
        var parseUrl = 'https://jx.xmflv.cc/?url=' + encodeURIComponent(cleanUrl);
        window.open(parseUrl, '_blank');
    }
</script>

</body>
</html>

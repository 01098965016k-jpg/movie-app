<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP追剧神器 - 尊享超清蓝光版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #fafbfc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 500px;
            padding: 35px 30px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h2 {
            margin-bottom: 25px;
            color: #1a1a1a;
            font-weight: 700;
            font-size: 22px;
        }
        .input-wrapper {
            margin-bottom: 20px;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            border: 2px solid #e1e4e8;
            border-radius: 10px;
            outline: none;
            transition: all 0.2s;
        }
        .input-wrapper input:focus {
            border-color: #67c23a;
            box-shadow: 0 0 0 3px rgba(103, 194, 58, 0.15);
        }
        .btn-play {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            background-color: #67c23a;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        .btn-play:active {
            background-color: #5daf34;
            transform: scale(0.98);
        }
        .reminder {
            font-size: 13px;
            color: #909399;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>VIP 追剧神器 (尊享超清/蓝光)</h2>
    
    <div class="input-wrapper">
        <input type="text" id="videoUrl" placeholder="粘贴视频网址 (优酷、腾讯、爱奇艺等)">
    </div>

    <button class="btn-play" onclick="playVideo()">▶ 立即播放 (超清/蓝光源)</button>

    <div class="reminder">
        ✨ 已为你固定启用<b>全网超清/蓝光专线</b>，支持自动选集与下一集。
    </div>
</div>

<script>
    function playVideo() {
        var videoInput = document.getElementById('videoUrl').value.trim();
        if (!videoInput) {
            alert('请先粘贴视频网址！');
            return;
        }
        
        // 专攻超清/蓝光画质接口
        var ultraHdApi = 'https://jx.quankan.app/jiexi/?url=';
        var parseUrl = ultraHdApi + encodeURIComponent(videoInput);
        
        window.open(parseUrl, '_blank');
    }
</script>

</body>
</html>

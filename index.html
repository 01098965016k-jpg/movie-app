<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP免费追剧神器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 680px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-group input {
            flex: 1;
            padding: 10px 14px;
            font-size: 15px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #409eff;
        }
        .line-select {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #606266;
        }
        .line-select select {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #dcdfe6;
            outline: none;
            font-size: 14px;
            background-color: #fff;
        }
        .btn {
            padding: 10px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-clear {
            background-color: #909399;
            color: white;
        }
        .btn-clear:hover { background-color: #73767a; }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-platform {
            background-color: #409eff;
            color: white;
        }
        .btn-platform:hover { background-color: #66b1ff; }

        .btn-play {
            background-color: #67c23a;
            color: white;
            font-weight: bold;
            grid-column: span 2;
        }
        .btn-play:hover { background-color: #85ce61; }

        .reminder {
            margin-top: 25px;
            text-align: center;
            color: #f56c6c;
            font-weight: bold;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>VIP免费追剧神器</h2>
    
    <!-- 输入框区域 -->
    <div class="input-group">
        <input type="text" id="videoUrl" placeholder="粘贴视频网址到这里: ">
        <button class="btn btn-clear" onclick="empty()">清空</button>
    </div>

    <!-- 线路选择区域 -->
    <div class="line-select">
        <label for="parseLine"><b>选择解析线路：</b></label>
        <select id="parseLine">
            <option value="https://jx.xmflv.cc/?url=" selected>线路一【XM高清主线】</option>
            <option value="https://jx.playerjy.com/?url=">线路二【JY超清备用】</option>
            <option value="https://jx.jsonplayer.com/player/?url=">线路三【JSON极速】</option>
            <option value="https://jx.quankan.app/jiexi/?url=">线路四【全看蓝光】</option>
        </select>
    </div>

    <!-- 平台与播放按钮 -->
    <div class="btn-grid">
        <button class="btn btn-platform" onclick="openIqy()">爱奇艺</button>
        <button class="btn btn-platform" onclick="openTx()">腾讯视频</button>
        <button class="btn btn-platform" onclick="openYq()">优酷视频</button>
        <button class="btn btn-play" onclick="playVideo()">▶ 立即播放 VIP 视频</button>
    </div>

    <div class="reminder">
        提示：如果画质不佳或播放卡顿，请在上方切换“解析线路”重新播放！
    </div>
</div>

<script>
    function empty() {
        document.getElementById('videoUrl').value = '';
    }

    function openIqy() {
        window.open('https://www.iqiyi.com', '_blank');
    }

    function openTx() {
        window.open('https://v.qq.com', '_blank');
    }

    function openYq() {
        window.open('https://www.youku.com/', '_blank');
    }

    function playVideo() {
        var video = document.getElementById('videoUrl').value.trim();
        if (!video) {
            alert('请先粘贴视频网址！');
            return;
        }
        
        // 获取选中的解析接口线路
        var api = document.getElementById('parseLine').value;
        var parseUrl = api + encodeURIComponent(video);
        
        window.open(parseUrl, '_blank');
    }
</script>

</body>
</html>
